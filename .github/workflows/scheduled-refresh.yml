name: Scheduled dashboard refresh

# Pulls each registered cluster's Jira filter directly from the Atlassian API,
# transforms the response into the dashboard's snapshot format, and commits the
# result. Runs twice per business day so the dashboard is never more than
# ~8 hours stale during working hours.
#
# Schedule reference: cron is in UTC. ET is UTC-4 in summer, UTC-5 in winter.
# Times below target ET business hours using the summer offset.
#
# Clusters are defined in clusters.json. To add or remove a cluster:
#   1. Edit clusters.json (add/remove an object in the "clusters" array)
#   2. Commit and push
#   3. Next scheduled run picks up the change automatically
# Each cluster writes its data to snapshots-<filter_id>.json. The aggregator
# file snapshots.json is rebuilt after every run.

on:
  schedule:
    # 8am ET = 12:00 UTC, 4pm ET = 20:00 UTC (Mon-Fri)
    - cron: '0 12 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:  # allow manual trigger from Actions tab

permissions:
  contents: write
  issues: write    # needed to open issues on failure

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read cluster registry
        id: read_registry
        run: |
          set -euo pipefail
          if [ ! -f clusters.json ]; then
            echo "ERROR: clusters.json not found. The dashboard cannot refresh." >&2
            exit 1
          fi
          # Extract just the IDs as a space-separated list for the next step
          CLUSTER_IDS=$(python3 -c "import json; print(' '.join(str(c['id']) for c in json.load(open('clusters.json'))['clusters']))")
          if [ -z "$CLUSTER_IDS" ]; then
            echo "ERROR: clusters.json has no clusters registered. Add at least one cluster." >&2
            exit 1
          fi
          echo "Cluster IDs to refresh: $CLUSTER_IDS"
          echo "cluster_ids=$CLUSTER_IDS" >> "$GITHUB_OUTPUT"

      - name: Fetch Jira filter for each registered cluster
        id: fetch
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_HOST: ${{ secrets.JIRA_HOST }}
        run: |
          set -euo pipefail
          FAILED_CLUSTERS=""
          for CLUSTER_ID in ${{ steps.read_registry.outputs.cluster_ids }}; do
            echo "===================================="
            echo "Fetching cluster ID: $CLUSTER_ID"
            echo "===================================="
            OUTPUT_FILE="snapshots-${CLUSTER_ID}.json"
            if python3 fetch_jira_filter.py \
                --host "$JIRA_HOST" \
                --user "$JIRA_USER" \
                --token "$JIRA_TOKEN" \
                --filter-id "$CLUSTER_ID" \
                --output "$OUTPUT_FILE"; then
              echo "OK: $OUTPUT_FILE updated"
            else
              echo "FAILED: cluster $CLUSTER_ID"
              FAILED_CLUSTERS="$FAILED_CLUSTERS $CLUSTER_ID"
            fi
          done
          if [ -n "$FAILED_CLUSTERS" ]; then
            echo ""
            echo "WARNING: One or more clusters failed:$FAILED_CLUSTERS"
            echo "The successful clusters were still updated. Failed clusters keep their last good snapshot."
          fi

      - name: Rebuild aggregator snapshots.json
        run: |
          set -euo pipefail
          python3 build_aggregator.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all snapshot files (aggregator + per-cluster)
          git add snapshots.json snapshots-*.json 2>/dev/null || true

          if git diff --quiet --cached; then
            echo "No snapshot changes — nothing to commit."
            exit 0
          fi

          # Build commit message from what changed
          CHANGED_FILES=$(git diff --cached --name-only | grep -E '^snapshots' | tr '\n' ' ')
          TODAY=$(date -u +%Y-%m-%d)
          git commit -m "auto: scheduled refresh — $TODAY ($CHANGED_FILES)"
          git push

      - name: On failure, open an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const now = new Date().toISOString().replace(/T/, ' ').replace(/\..+/, '') + ' UTC';
            const title = `Auto-refresh failed at ${now}`;
            const body = [
              '## Scheduled dashboard refresh failed',
              '',
              `**When:** ${now}`,
              `**Run:** ${runUrl}`,
              '',
              '### What this means',
              '',
              'The scheduled Action that pulls Jira data into the dashboard could not complete. The dashboard will continue showing the last successful snapshot until this is resolved.',
              '',
              '### Likely causes',
              '',
              '1. **Jira API token expired or revoked** — most common. Generate a new token at https://id.atlassian.com/manage-profile/security/api-tokens and update the `JIRA_TOKEN` secret in repo Settings → Secrets.',
              '2. **A filter listed in clusters.json was deleted or its permissions changed** — verify each filter still exists and is accessible to the token-holder.',
              '3. **Jira API outage** — check https://status.atlassian.com/. If outage, no action needed; will recover automatically.',
              '4. **Snapshot data parsing failed** — Jira may have introduced new statuses or fields. Review the run logs.',
              '5. **clusters.json is missing or malformed** — the workflow expects a "clusters" array of objects with "id" and "title".',
              '',
              '### Backup workflow still works',
              '',
              'While this is broken, anyone can still manually upload a Jira HTML export to the `jira-exports/` folder. The existing manual-update workflow will process it normally (default cluster only).',
              '',
              '### How to close this issue',
              '',
              'Once the scheduled Action runs successfully again, close this issue manually. (Successful runs do not auto-close issues.)'
            ].join('\n');

            // Check if there's already an open auto-refresh-failed issue — avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-refresh-failure'
            });
            if (existing.data.length > 0) {
              // Comment on the existing issue instead of opening a new one
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Another failure at ${now}. Run: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['auto-refresh-failure']
              });
            }
